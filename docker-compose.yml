services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: durableq
      POSTGRES_PASSWORD: durableq
      POSTGRES_DB: durableq
    ports: ["${DURABLEQ_PG_PORT:-5432}:5432"]  # override if 5432 is taken, e.g. by a local Postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "durableq"]
      interval: 1s
      retries: 30

  # docker compose run --rm demo                          (defaults: 10,000 jobs)
  # docker compose run --rm demo demo --jobs 1000 --kills 20   (override flags)
  demo:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://durableq:durableq@postgres:5432/durableq?sslmode=disable
    command: ["demo"]
    profiles: ["demo"]
