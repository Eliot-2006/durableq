name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: durableq
          POSTGRES_PASSWORD: durableq
          POSTGRES_DB: durableq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U durableq"
          --health-interval 1s --health-retries 30
    env:
      DATABASE_URL: postgres://durableq:durableq@localhost:5432/durableq?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run ./cmd/durableq migrate
      - run: go test -race ./...
      - name: short chaos run (1,000 jobs, ~20 kills) + Postgres crash-restarts
        run: go test -tags chaos -timeout 5m ./chaos/...
        env:
          DURABLEQ_PG_RESTART_CMD: docker restart -t 0 ${{ job.services.postgres.id }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: durableq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: durableq:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # kubeconform is required by `make helm-lint`
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: make helm-lint

  kind-e2e:
    needs: [image, helm]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: durableq:dev
          cache-from: type=gha
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: durableq
      - run: kind load docker-image durableq:dev --name durableq
      - name: deploy
        run: >-
          helm upgrade --install durableq deploy/helm/durableq
          --namespace durableq --create-namespace
          -f deploy/helm/durableq/values-ci.yaml
          --set image.repository=durableq --set image.tag=dev --set image.pullPolicy=Never
          --wait --timeout 5m
      - run: scripts/k8s-smoke.sh
      - name: dump cluster state
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n durableq describe pods
          kubectl -n durableq get events --sort-by=.lastTimestamp
          for p in $(kubectl -n durableq get pods -o name); do
            echo "::group::logs $p"
            kubectl -n durableq logs "$p" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
