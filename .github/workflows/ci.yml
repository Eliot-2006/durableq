name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: durableq
          POSTGRES_PASSWORD: durableq
          POSTGRES_DB: durableq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U durableq"
          --health-interval 1s --health-retries 30
    env:
      DATABASE_URL: postgres://durableq:durableq@localhost:5432/durableq?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run ./cmd/durableq migrate
      - run: go test -race ./...
      - name: short chaos run (1,000 jobs, ~20 kills) + Postgres crash-restarts
        run: go test -tags chaos -timeout 5m ./chaos/...
        env:
          DURABLEQ_PG_RESTART_CMD: docker restart -t 0 ${{ job.services.postgres.id }}
