name: nightly-chaos
on:
  schedule: [{cron: "0 9 * * *"}]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: durableq
          POSTGRES_PASSWORD: durableq
          POSTGRES_DB: durableq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U durableq"
          --health-interval 1s --health-retries 30
    env:
      DATABASE_URL: postgres://durableq:durableq@localhost:5432/durableq?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: long chaos run (10,000 jobs, 20 seeds)
        run: >-
          go test -tags chaos -timeout 0 -v -run 'TestChaos$' ./chaos/
          -args -jobs 10000 -kills 100 -conn-kills 20 -stalls 5 -sleep-ms 100 -seeds 20
