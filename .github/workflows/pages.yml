name: pages

# Builds the Astro site on every relevant change; deploys to GitHub Pages only from main.
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npx astro build
      - name: Check internal links and assets
        run: node scripts/check-links.mjs dist /durableq/
      - name: Simulation engine tests
        run: |
          if [ -f src/sim/engine.test.ts ]; then
            node --test src/sim/engine.test.ts
          else
            echo "src/sim/engine.test.ts not present; skipping"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
