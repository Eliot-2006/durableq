{{- include "durableq.validate" . -}}
{{- if .Values.postgresql.enabled }}
{{- $pw := include "durableq.pgPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "durableq.secretName" . }}
  labels:
    {{- include "durableq.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  {{ .Values.database.secretKey }}: {{ printf "postgres://durableq:%s@%s-postgres.%s.svc:5432/durableq?sslmode=disable" (urlquery $pw) (include "durableq.fullname" .) .Release.Namespace | quote }}
{{- end }}
