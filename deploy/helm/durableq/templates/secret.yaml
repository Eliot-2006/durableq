{{- include "durableq.validate" . -}}
{{- if .Values.postgresql.enabled }}
{{- $pw := include "durableq.pgPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "durableq.secretName" . }}
  labels:
    {{- include "durableq.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  annotations:
    # The Postgres PVC outlives `helm uninstall` (StatefulSet PVCs are retained), and initdb
    # never runs again on it, so the generated password must survive too. A reinstall
    # under the same release name adopts this Secret.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  {{ .Values.database.secretKey }}: {{ printf "postgres://durableq:%s@%s-postgres.%s.svc:5432/durableq?sslmode=disable" (urlquery $pw | replace "+" "%20") (include "durableq.fullname" .) .Release.Namespace | quote }}
{{- end }}
