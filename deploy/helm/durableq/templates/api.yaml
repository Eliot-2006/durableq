{{- $c := dict "ctx" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "durableq.fullname" . }}-api
  labels:
    {{- include "durableq.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "durableq.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "durableq.labels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # preStop sleep (5s) + serve's --shutdown-timeout (10s) + margin.
      terminationGracePeriodSeconds: 20
      securityContext:
        {{- include "durableq.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "durableq.migrateInit" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "durableq.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--addr=:8080", "--max-conns=$(API_MAX_CONNS)"]
          env:
            {{- include "durableq.dbEnv" . | nindent 12 }}
            - name: API_MAX_CONNS
              valueFrom: {configMapKeyRef: {name: {{ include "durableq.fullname" . }}, key: API_MAX_CONNS}}
          ports:
            - {name: http, containerPort: 8080}
          lifecycle:
            # Keep serving while the endpoint is removed from Services (readiness alone
            # lags by up to a probe period), then SIGTERM flips /readyz and drains.
            preStop:
              sleep: {seconds: 5}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            {{- include "durableq.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "durableq.fullname" . }}-api
  labels:
    {{- include "durableq.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "durableq.selectorLabels" $c | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
