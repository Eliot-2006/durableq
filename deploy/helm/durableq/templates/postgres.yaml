{{- if .Values.postgresql.enabled }}
{{- $c := dict "ctx" . "component" "postgres" }}
{{- $name := printf "%s-postgres" (include "durableq.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "durableq.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "durableq.selectorLabels" $c | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "durableq.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "durableq.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "durableq.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          args: ["-c", "max_connections={{ .Values.postgresql.maxConnections }}"]
          env:
            - {name: POSTGRES_USER, value: durableq}
            - {name: POSTGRES_DB, value: durableq}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "durableq.secretName" . }}, key: POSTGRES_PASSWORD}
          ports:
            - {name: postgres, containerPort: 5432}
          startupProbe:
            exec: {command: ["pg_isready", "-U", "durableq", "-d", "durableq"]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "durableq", "-d", "durableq"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "durableq", "-d", "durableq"]}
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            {{- include "durableq.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
